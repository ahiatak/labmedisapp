services:
  postgres:
    image: postgres:16
    container_name: labmedis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: labmedis
      POSTGRES_PASSWORD: labmedis_dev_password
      POSTGRES_DB: labmedis
    ports:
      - "5432:5432"
    volumes:
      - labmedis_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labmedis -d labmedis"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: labmedis-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  labmedis_postgres_data:
